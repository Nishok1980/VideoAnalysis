server.address=127.0.0.1
server.port=8080
spring.servlet.multipart.max-file-size=250MB
spring.servlet.multipart.max-request-size=251MB
spring.servlet.multipart.file-size-threshold=0
server.error.include-message=never
server.error.include-stacktrace=never
analysis.ffmpeg=${VIDEO_FFMPEG:ffmpeg}
analysis.ffprobe=${VIDEO_FFPROBE:ffprobe}
analysis.model=${VIDEO_MODEL:./models/yolov10n.onnx}
analysis.data=${VIDEO_DATA:./data}
# Preserve the recording's explicit UTC offset for local clock schedules.
spring.jackson.datatype.datetime.adjust-dates-to-context-time-zone=false
spring.jackson.datatype.datetime.write-dates-with-context-time-zone=false
